# AI Stock Trader configuration.
#
# Only YOU should change the risk limits in this file. Claude is told never to
# loosen them (see CLAUDE.md), and Claude Code will ask you before it edits a file.

[general]
# "paper" = simulated money, no real orders (default; start here).
# "live"  = real orders through Robinhood Agentic Trading.
mode = "paper"
# Master switch. false = the trade guard blocks every order.
trading_enabled = true
timezone = "America/New_York"

[watchlist]
# The bot only buys symbols on this list. Individual stocks only: no ETFs, and the
# trade guard blocks options, crypto and everything else. Stick to liquid large caps.
symbols = [
  "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META",
  "JPM", "XOM", "COST", "LLY", "V", "UNH",
]
# What the bot has to beat. Used only for comparison; the bot never trades it.
# If the bot can't beat buy-and-hold SPY, buy SPY instead.
benchmark = "SPY"

[data]
# "yfinance" downloads free daily bars from Yahoo Finance.
# "files" reads CSV/JSON bars from files_dir (e.g. saved Robinhood historicals).
source = "yfinance"
files_dir = "data/bars"
history_days = 600

[portfolio]
# How the money is split. core_pct + trend_pct + min_cash_reserve_pct must be <= 100.
core_pct = 80.0            # always held, in equal amounts across the watchlist stocks
trend_pct = 15.0           # extra for stocks in an uptrend (trend_pct / number of stocks each)
rebalance_band_pct = 25.0  # only trade a stock once it drifts this far from its target
                           # (as a % of one core slice), to avoid lots of tiny trades
reentry_wait_days = 10     # after a trend slice is sold, wait this many days before re-buying it
                           # (it is never re-bought the same day)

[strategy]
# A stock is in an uptrend when price > its 200-day average and the 50-day > the 200-day.
sma_fast = 50
sma_slow = 200
atr_period = 14
trailing_stop_atr = 3.0    # profit lock: once a trend slice's trailing stop (3 ATRs below
                           # its highest close) rises above its purchase price, it replaces
                           # the stop loss so gains aren't given back
volume_lookback = 20

[risk]
starting_paper_cash = 10000.0
stop_loss_pct = 10.0             # sell a TREND slice if it falls 10% below what it cost
                                 # (0 = off). The core is never stopped out. Checked
                                 # against the current price on every run.
min_cash_reserve_pct = 5.0
daily_loss_limit_pct = 3.0       # no buys after the account drops 3% in a day
max_drawdown_pct = 15.0          # no buys while the account is 15%+ below its peak
min_price = 5.0                  # no penny stocks
min_avg_dollar_volume = 20000000 # skip illiquid stocks ($20M/day average)
fractional_shares = true         # buy partial shares so every stock can sit at its
                                 # target. With whole shares, a $10,000 account can't
                                 # even buy 1 share of some $800+ stocks.

[orders]
order_type = "limit"        # "limit" (recommended) or "market"
limit_buffer_pct = 0.5      # buy limit = last close +0.5%, sell limit = last close -0.5%
ticket_ttl_minutes = 120    # approved orders expire if not placed within this window
slippage_bps = 5            # assumed slippage for paper fills and backtests
account_max_age_minutes = 30  # live mode: account snapshot must be this fresh

[review]
# Rules for Claude's judgment step. Claude can only VETO buys, never add or enlarge them.
avoid_earnings_within_days = 5
